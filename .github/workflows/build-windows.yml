name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive build version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.build_version }}"
          if (-not $v) {
            if ($env:GITHUB_REF -like "refs/tags/v*") {
              $v = $env:GITHUB_REF -replace "^refs/tags/v", ""
            } else {
              $v = "1.0.0"
            }
          }
          echo "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -BuildVersion "${{ steps.version.outputs.value }}" `
            -BuildNumber ${{ github.run_number }} -SkipSign

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Centurio-windows-${{ steps.version.outputs.value }}
          path: |
            build/windows/Centurio.exe
            build/windows/Centurio.exe.sha256
            installer/Output/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/Centurio.exe
            build/windows/Centurio.exe.sha256
            installer/Output/*.exe
